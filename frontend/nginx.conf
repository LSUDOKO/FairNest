server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri $uri.html $uri/ =404; }
  location /api/ {
    proxy_pass https://fairnest.adoranto737.workers.dev;
    proxy_set_header Host fairnest.adoranto737.workers.dev;
    proxy_ssl_server_name on;
  }
  error_page 404 /404.html;
}
